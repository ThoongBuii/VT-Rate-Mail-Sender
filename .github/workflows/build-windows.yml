name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-build.txt pywin32

      - name: Build with PyInstaller
        run: pyinstaller packaging/vt_rate.spec --noconfirm

      - name: Zip folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\VTRateMailSender -DestinationPath dist\VT-Rate-Mail-Sender-Windows.zip -Force
          Get-Item dist\VT-Rate-Mail-Sender-Windows.zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VT-Rate-Mail-Sender-Windows
          path: dist/VT-Rate-Mail-Sender-Windows.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="v1.0.0"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/VT-Rate-Mail-Sender-Windows.zip --clobber
          else
            gh release create "$TAG" dist/VT-Rate-Mail-Sender-Windows.zip \
              --title "$TAG — Windows" \
              --notes "Bản Windows desktop (Outlook). Giải nén → chạy VTRateMailSender.exe"
          fi
